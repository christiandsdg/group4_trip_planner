[project]
name = "group4-trip-planner"
version = "0.1.0"
description = "Trip Planner: a web app for planning a group trip and managing its money: travelers, trips, bookings, shared expenses, currency conversion and budgets."
readme = "README.md"
authors = [
    { name = "Christian Da Silva De Goes", email = "234804319+christiandsdg@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
group4-trip-planner = "group4-trip-planner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
